<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Portfolio</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

    <div class="logo">
        Ram Portfolio
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="skills.html">Skills</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

</header>

<section class="contact-section">

    <div class="contact-left">

        <h1>Let's Connect</h1>

        <p>
            Contact me for projects, collaborations,
            internships, or opportunities.
        </p>

        <div class="contact-links">

            <a href="https://www.linkedin.com/in/ram-mahadev-pandhare-724492382" target="_blank">
                LinkedIn Profile
            </a>

            <a href="mailto: parammahadev21@gmail.com">
                Send Email 
            </a>

        </div>

    </div>

    <div class="contact-right">

        <form id="contactForm" class="contact-form">

            <input 
            type="text" 
            id="name"
            placeholder="Your Name"
            required>

            <input 
            type="email" 
            id="email"
            placeholder="Your Email"
            required>

            <textarea 
            id="message"
            placeholder="Write Your Message..."
            required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

<footer>

    <p>
        © 2026 Ram Mahadev Pandhare | Portfolio
    </p>

</footer>

<!-- FIREBASE SCRIPT -->

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyBEUaZ3a2jEjASA7tmWpaTOJod_SwbvZUg",
  authDomain: "portfolio-contact-44e9b.firebaseapp.com",
  projectId: "portfolio-contact-44e9b",
  storageBucket: "portfolio-contact-44e9b.firebasestorage.app",
  messagingSenderId: "964519094829",
  appId: "1:964519094829:web:f941eba4c914cf00a8e6a4",
  measurementId: "G-7PRWGR9K5K"
};

/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* FORM SUBMIT */

document
.getElementById("contactForm")

.addEventListener("submit", async (e) => {

    e.preventDefault();

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const message =
    document.getElementById("message").value;

    try {

        await addDoc(
            collection(db, "messages"),
            {
                name: name,
                email: email,
                message: message,
                createdAt: new Date()
            }
        );

        alert("Message Sent Successfully!");

        document
        .getElementById("contactForm")
        .reset();

    }

    catch(error){

        alert("Error Sending Message");

        console.log(error);
    }

});

</script>

</body>
</html>
