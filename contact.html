<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        RP.
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="skills.html">Skills</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<section class="contact-page">

    <div class="contact-info">

        <h1>Contact Me</h1>

        <p>
            Available for collaborations, internships,
            freelance work, and innovative projects.
        </p>

        <div class="social-links">

            <a href="https://www.linkedin.com/in/ram-mahadev-pandhare-724492382" target="_blank">
                LinkedIn
            </a>

            <a href="mailto: parammahadev21@gmail.com">
                Email
            </a>

        </div>

    </div>

    <form id="contactForm" class="contact-form">

        <input 
        type="text" 
        id="name"
        placeholder="Your Name"
        required>

        <input 
        type="email"
        id="email"
        placeholder="Your Email"
        required>

        <textarea
        id="message"
        placeholder="Your Message"
        required></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBEUaZ3a2jEjASA7tmWpaTOJod_SwbvZUg",
  authDomain: "portfolio-contact-44e9b.firebaseapp.com",
  projectId: "portfolio-contact-44e9b",
  storageBucket: "portfolio-contact-44e9b.firebasestorage.app",
  messagingSenderId: "964519094829",
  appId: "1:964519094829:web:f941eba4c914cf00a8e6a4",
  measurementId: "G-7PRWGR9K5K"
};
const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

document
.getElementById("contactForm")

.addEventListener("submit", async (e) => {

    e.preventDefault();

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const message =
    document.getElementById("message").value;

    try{

        await addDoc(
            collection(db, "messages"),
            {
                name,
                email,
                message,
                createdAt: new Date()
            }
        );

        alert("Message Sent!");

        document
        .getElementById("contactForm")
        .reset();

    }

    catch(error){

        alert("Error Sending Message");

        console.log(error);
    }

});

</script>

</body>
</html>
