<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skills.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">RP.</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="skills.html" class="active">Skills</a>
      <a href="profile.html">Profile</a>
      <a href="achievements.html">Achievements</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>


  <!-- PAGE HERO -->
  <div class="page-hero">
    <p class="tag">What I Know</p>
    <h1>My Skills</h1>
    <p>Technologies and tools I work with to build modern digital products.</p>
  </div>


  <!-- SKILLS -->
  <div class="skills-wrapper">
    <div id="skills-loading" class="page-loading">⏳ Loading skills...</div>
    <div id="skills-empty"   class="page-empty"   style="display:none;">📭 No skills yet.</div>
    <div id="skills-content" style="display:none;"></div>
  </div>


  <!-- FOOTER -->
  <footer>
    <p>© 2026 Ram Mahadev Pandhare</p>
  </footer>


  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import { getFirestore, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEUaZ3a2jEjASA7tmWpaTOJod_SwbvZUg",
      authDomain: "portfolio-contact-44e9b.firebaseapp.com",
      projectId: "portfolio-contact-44e9b",
      storageBucket: "portfolio-contact-44e9b.firebasestorage.app",
      messagingSenderId: "964519094829",
      appId: "1:964519094829:web:f941eba4c914cf00a8e6a4",
      measurementId: "G-7PRWGR9K5K"
    };

    async function loadSkills() {
      const loading = document.getElementById('skills-loading');
      const empty   = document.getElementById('skills-empty');
      const content = document.getElementById('skills-content');

      try {
        const app  = initializeApp(firebaseConfig);
        const db   = getFirestore(app);
        const snap = await getDocs(collection(db, "skills"));

        loading.style.display = 'none';

        if (snap.empty) {
          empty.style.display = 'block';
          return;
        }

        content.style.display = 'block';

        // Group by category
        const categories = {};
        snap.forEach(docSnap => {
          const d   = docSnap.data();
          const cat = d.category || 'Other';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(d);
        });

        // Render each category
        Object.entries(categories).forEach(([cat, skills]) => {

          const section = document.createElement('div');

          const label = document.createElement('p');
          label.className   = 'skills-category';
          label.textContent = cat;
          section.appendChild(label);

          const grid = document.createElement('div');
          grid.className = 'skills-grid';

          skills.forEach((d, i) => {
            const card = document.createElement('div');
            card.className = 'skill-card';
            card.style.animationDelay = `${i * 0.08}s`;
            card.innerHTML = `
              <div class="skill-icon">${d.icon || '⚡'}</div>
              <span class="skill-name">${d.name}</span>
              <div class="skill-bar-track">
                <div class="skill-bar-fill" data-level="${d.progress || 50}"></div>
              </div>
              <span class="skill-level">${d.level || 'Intermediate'}</span>
            `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          content.appendChild(section);
        });

        // Animate bars on scroll
        const fills = document.querySelectorAll('.skill-bar-fill');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.style.width = entry.target.dataset.level + '%';
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.3 });

        fills.forEach(fill => observer.observe(fill));

      } catch (err) {
        const loading = document.getElementById('skills-loading');
        loading.innerHTML = `
          <div style="color:#c62828;background:#fff5f5;border:1px solid #ffcdd2;
                      padding:16px;border-radius:10px;font-size:0.9rem;
                      max-width:500px;margin:0 auto;text-align:left;">
            ❌ Error: <strong>${err.code || 'unknown'}</strong><br>${err.message}
          </div>`;
      }
    }

    loadSkills();
  </script>

  <script src="js/main.js"></script>

</body>
</html>
