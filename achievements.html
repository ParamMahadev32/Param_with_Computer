<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements | Ram Pandhare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/achievements.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">RP.</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="skills.html">Skills</a>
      <a href="profile.html">Profile</a>
      <a href="achievements.html" class="active">Achievements</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>


  <!-- PAGE HERO -->
  <div class="page-hero">
    <p class="tag">My Milestones</p>
    <h1>Achievements</h1>
    <p>Certifications, awards and milestones I have earned along the way.</p>
  </div>


  <!-- ACHIEVEMENTS -->
  <div class="achievements-wrapper">
    <div id="achievements-loading" class="page-loading">⏳ Loading achievements...</div>
    <div id="achievements-empty"   class="page-empty"   style="display:none;">📭 No achievements yet.</div>
    <div id="achievements-content" style="display:none;"></div>
  </div>


  <!-- FOOTER -->
  <footer>
    <p>© 2026 Ram Mahadev Pandhare</p>
  </footer>


  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import { getFirestore, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEUaZ3a2jEjASA7tmWpaTOJod_SwbvZUg",
      authDomain: "portfolio-contact-44e9b.firebaseapp.com",
      projectId: "portfolio-contact-44e9b",
      storageBucket: "portfolio-contact-44e9b.firebasestorage.app",
      messagingSenderId: "964519094829",
      appId: "1:964519094829:web:f941eba4c914cf00a8e6a4",
      measurementId: "G-7PRWGR9K5K"
    };

    // Emoji based on tag
    function getEmoji(tag) {
      if (!tag) return '🏆';
      const t = tag.toLowerCase();
      if (t.includes('certif'))    return '📜';
      if (t.includes('award'))     return '🎖️';
      if (t.includes('competit'))  return '🥇';
      if (t.includes('hackathon')) return '💻';
      if (t.includes('scholar'))   return '🎓';
      return '🏆';
    }

    async function loadAchievements() {
      const loading = document.getElementById('achievements-loading');
      const empty   = document.getElementById('achievements-empty');
      const content = document.getElementById('achievements-content');

      try {
        const app  = initializeApp(firebaseConfig);
        const db   = getFirestore(app);
        const snap = await getDocs(collection(db, "achievements"));

        loading.style.display = 'none';

        if (snap.empty) {
          empty.style.display = 'block';
          return;
        }

        content.style.display = 'block';

        snap.forEach((docSnap, i) => {
          const d         = docSnap.data();
          const isReverse = i % 2 !== 0;

          const item = document.createElement('div');
          item.className = `achievement-item${isReverse ? ' reverse' : ''}`;

          item.innerHTML = `
            <div class="achievement-info glass-card">
              <span class="achievement-tag">${d.tag || 'Achievement'}</span>
              <h2>${d.title}</h2>
              <p>${d.desc}</p>
              <div class="achievement-meta">
                ${d.org  ? `<span class="meta-item">🏛️ Issued by: ${d.org}</span>`  : ''}
                ${d.year ? `<span class="meta-item">📅 Year: ${d.year}</span>` : ''}
              </div>
            </div>
            <div class="achievement-image ${d.img ? '' : 'img-fallback'}">
              ${d.img
                ? `<img
                    src="${d.img}"
                    alt="${d.title}"
                    onerror="this.parentElement.classList.add('img-fallback');
                             this.style.display='none';"
                  >`
                : ''}
              <div class="img-placeholder">${getEmoji(d.tag)}</div>
            </div>
          `;

          content.appendChild(item);
        });

        // Animate on scroll
        const items = document.querySelectorAll('.achievement-item');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        items.forEach(item => observer.observe(item));

      } catch (err) {
        loading.innerHTML = `
          <div style="color:#c62828;background:#fff5f5;border:1px solid #ffcdd2;
                      padding:16px;border-radius:10px;font-size:0.9rem;
                      max-width:500px;margin:0 auto;text-align:left;">
            ❌ Error: <strong>${err.code || 'unknown'}</strong><br>${err.message}
          </div>`;
      }
    }

    loadAchievements();
  </script>

  <script src="js/main.js"></script>

</body>
</html>
