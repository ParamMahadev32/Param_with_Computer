<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements | Ram Pandhare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/achievements.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">RP.</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="skills.html">Skills</a>
      <a href="profile.html">Profile</a>
      <a href="achievements.html" class="active">Achievements</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>


  <!-- PAGE HERO -->
  <div class="page-hero">
    <p class="tag">My Milestones</p>
    <h1>Achievements</h1>
    <p id="achievements-subtitle">Certifications, awards and milestones I have earned along the way.</p>
  </div>


  <!-- FILTER BUTTONS -->
  <div class="filter-wrapper">
    <div class="filter-buttons" id="filter-buttons">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="AI & ML">🤖 AI & ML</button>
      <button class="filter-btn" data-cat="Python">🐍 Python</button>
      <button class="filter-btn" data-cat="Web Development">🌐 Web Development</button>
      <button class="filter-btn" data-cat="Cloud & DevOps">☁️ Cloud & DevOps</button>
      <button class="filter-btn" data-cat="Data">📊 Data</button>
      <button class="filter-btn" data-cat="Security">🔒 Security</button>
      <button class="filter-btn" data-cat="Other">📌 Other</button>
    </div>
  </div>


  <!-- ACHIEVEMENTS GRID -->
  <div class="achievements-wrapper">
    <div id="achievements-loading" class="page-loading">⏳ Loading achievements...</div>
    <div id="achievements-empty" class="page-empty" style="display:none;">📭 No achievements yet.</div>
    <div id="achievements-grid" class="achievements-grid" style="display:none;"></div>
  </div>


  <!-- FOOTER -->
  <footer>
    <p>© 2026 Ram Mahadev Pandhare</p>
  </footer>


  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import { getFirestore, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEUaZ3a2jEjASA7tmWpaTOJod_SwbvZUg",
      authDomain: "portfolio-contact-44e9b.firebaseapp.com",
      projectId: "portfolio-contact-44e9b",
      storageBucket: "portfolio-contact-44e9b.firebasestorage.app",
      messagingSenderId: "964519094829",
      appId: "1:964519094829:web:f941eba4c914cf00a8e6a4",
      measurementId: "G-7PRWGR9K5K"
    };

    // Category emoji map
    const catEmoji = {
      'AI & ML':         '🤖',
      'Python':          '🐍',
      'Web Development': '🌐',
      'Cloud & DevOps':  '☁️',
      'Data':            '📊',
      'Security':        '🔒',
      'Other':           '📌'
    };

    function getEmoji(cat) {
      return catEmoji[cat] || '🏆';
    }

    // All docs stored globally for filtering
    let allDocs = [];

    function renderGrid(docs) {
      const grid  = document.getElementById('achievements-grid');
      const empty = document.getElementById('achievements-empty');

      if (docs.length === 0) {
        grid.style.display  = 'none';
        empty.style.display = 'block';
        empty.textContent   = '📭 No achievements in this category.';
        return;
      }

      empty.style.display = 'none';
      grid.style.display  = 'grid';
      grid.innerHTML      = '';

      docs.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'achievement-card';
        card.style.animationDelay = `${i * 0.05}s`;

        card.innerHTML = `
          <div class="ac-image ${d.img ? '' : 'no-img'}">
            ${d.img
              ? `<img src="${d.img}" alt="${d.title}"
                      onerror="this.parentElement.classList.add('no-img');
                               this.style.display='none';">`
              : ''}
            <div class="ac-img-placeholder">${getEmoji(d.category || d.tag)}</div>
          </div>
          <div class="ac-body">
            <div class="ac-tags">
              ${d.category
                ? `<span class="ac-tag cat-tag">${getEmoji(d.category)} ${d.category}</span>`
                : ''}
              ${d.tag && d.tag !== d.category
                ? `<span class="ac-tag">${d.tag}</span>`
                : ''}
            </div>
            <h3>${d.title}</h3>
            <p class="ac-org">${d.org || ''}</p>
            ${d.year ? `<span class="ac-year">📅 ${d.year}</span>` : ''}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function loadAchievements() {
      const loading  = document.getElementById('achievements-loading');
      const subtitle = document.getElementById('achievements-subtitle');

      try {
        const app  = initializeApp(firebaseConfig);
        const db   = getFirestore(app);
        const snap = await getDocs(collection(db, "achievements"));

        loading.style.display = 'none';

        snap.forEach(docSnap => allDocs.push(docSnap.data()));

        // Update subtitle count
        subtitle.textContent =
          `${allDocs.length} verified achievement${allDocs.length !== 1 ? 's' : ''} earned across various platforms.`;

        renderGrid(allDocs);

        // Add dynamic category buttons from data
        const existingCats = new Set(
          allDocs.map(d => d.category).filter(Boolean)
        );
        const filterBtns = document.getElementById('filter-buttons');
        filterBtns.querySelectorAll('.filter-btn:not([data-cat="all"])').forEach(btn => {
          if (!existingCats.has(btn.dataset.cat)) {
            btn.style.display = 'none';
          }
        });

        // Filter click
        filterBtns.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            filterBtns.querySelectorAll('.filter-btn')
              .forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cat = btn.dataset.cat;
            const filtered = cat === 'all'
              ? allDocs
              : allDocs.filter(d => d.category === cat);

            renderGrid(filtered);
          });
        });

      } catch (err) {
        loading.innerHTML = `
          <div style="color:#c62828;background:#fff5f5;border:1px solid #ffcdd2;
                      padding:16px;border-radius:10px;font-size:0.9rem;
                      max-width:500px;margin:0 auto;">
            ❌ Error: <strong>${err.code || 'unknown'}</strong><br>${err.message}
          </div>`;
      }
    }

    loadAchievements();
  </script>

  <script src="js/main.js"></script>

</body>
</html>
